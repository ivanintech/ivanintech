# Override local para el stack ivanintech.
#
# IMPORTANTE: los puertos por defecto del template (3000, 8000, 5432, 80, 1080..)
# colisionan con servicios vivos de la infraestructura de Iván:
#   - OSIRIS ya publica :3000
#   - paperless-webserver ya publica :8000
#   - Postgres local ya publica :5432
#   - un proxy/nginx ya publica :80
# Por eso este override remapea a puertos exclusivos del stack ivanintech y
# excluye proxy (Traefik) y mailcatcher, que no hacen falta en dev local.
services:

  # Lanzamos SOLO lo necesario para ver la web en local:
  #   frontend → http://localhost:3010
  #   backend  → http://localhost:8001  (API: http://localhost:8001/docs)
  #   adminer  → http://localhost:8010
  #   db       → solo red interna (sin publicar 5432, para no chocar con Postgres)

  db:
    restart: "no"
    # Sin mapeo de puerto al host: la red interna de compose es suficiente.

  adminer:
    restart: "no"
    ports:
      - "8010:8080"

  prestart:
    # El compose principal le da solo .env (raíz); necesita también backend/.env
    # para las variables de la app (PROJECT_NAME, SQLITE_DB_FILE, EMAIL_*, etc.).
    env_file:
      - .env
      - ./backend/.env
    environment:
      # Forzar SQLite (BD real backend/ivanintech.db) en lugar de Postgres vacío:
      # anulamos POSTGRES_SERVER que el compose principal fija a "db".
      POSTGRES_SERVER: ""
      DATABASE_URL: ""
    volumes:
      # La app resuelve sqlite:///./ivanintech.db relativo a su CWD (/app/app),
      # por lo que crea /app/app/ivanintech.db. Ahí montamos la BD real.
      - ./backend/ivanintech.db:/app/app/ivanintech.db

  backend:
    restart: "no"
    env_file:
      - .env
      - ./backend/.env
    healthcheck:
      # La imagen no trae curl; usamos Python para el healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8001:8000"
    build:
      context: ./backend
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    volumes:
      - ./backend/htmlcov:/app/htmlcov
      - ./backend/ivanintech.db:/app/app/ivanintech.db
    environment:
      POSTGRES_SERVER: ""
      DATABASE_URL: ""
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"

  frontend:
    restart: "no"
    ports:
      - "3010:3000"
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8001/api/v1

networks:
  traefik-public:
    # El compose principal la declara "external: true" (porque en producción la
    # crea el proxy Traefik). Al quitar el proxy del override, la red externa ya
    # no existe -> la redefinimos como red de compose local para no fallar.
    external: false
