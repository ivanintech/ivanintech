# render.yaml
# Defines all services, databases, and environment variables for the project.
# See https://render.com/docs/blueprint-spec for details.

envVarGroups:
  - name: backend-env
    envVars:
      # Supabase y base de datos
      - key: SUPABASE_URL
        value: <YOUR_SUPABASE_URL>
      - key: SUPABASE_SERVICE_KEY
        value: <YOUR_SUPABASE_SERVICE_KEY>
      - key: DATABASE_URL
        value: <YOUR_DATABASE_URL>
      # Seguridad y usuarios
      - key: SECRET_KEY
        value: <YOUR_SECRET_KEY>
      - key: FIRST_SUPERUSER
        value: <YOUR_SUPERUSER_EMAIL>
      - key: FIRST_SUPERUSER_PASSWORD
        value: <YOUR_SUPERUSER_PASSWORD>
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        value: <YOUR_SENTRY_DSN>
      # CORS
      - key: BACKEND_CORS_ORIGINS
        value: <YOUR_CORS_ORIGINS>
      # Email
      - key: MAIL_USERNAME
        value: <YOUR_MAIL_USERNAME>
      - key: MAIL_PASSWORD
        value: <YOUR_MAIL_PASSWORD>
      - key: MAIL_FROM
        value: <YOUR_MAIL_FROM>
      - key: MAIL_FROM_NAME
        value: <YOUR_MAIL_FROM_NAME>
      - key: MAIL_PORT
        value: <YOUR_MAIL_PORT>
      - key: MAIL_SERVER
        value: <YOUR_MAIL_SERVER>
      - key: MAIL_STARTTLS
        value: <YOUR_MAIL_STARTTLS>
      - key: MAIL_SSL_TLS
        value: <YOUR_MAIL_SSL_TLS>
      - key: USE_CREDENTIALS
        value: <YOUR_USE_CREDENTIALS>
      - key: VALIDATE_CERTS
        value: <YOUR_VALIDATE_CERTS>
      # APIs externas y social login
      - key: GOOGLE_CLIENT_ID
        value: <YOUR_GOOGLE_CLIENT_ID>
      - key: GITHUB_CLIENT_ID
        value: <YOUR_GITHUB_CLIENT_ID>
      - key: GITHUB_CLIENT_SECRET
        value: <YOUR_GITHUB_CLIENT_SECRET>
      - key: GITHUB_WEBHOOK_SECRET
        value: <YOUR_GITHUB_WEBHOOK_SECRET>
      - key: GEMINI_API_KEY
        value: <YOUR_GEMINI_API_KEY>
      - key: GOOGLE_API_KEY
        value: <YOUR_GOOGLE_API_KEY>
      - key: GNEWS_API_KEY
        value: <YOUR_GNEWS_API_KEY>
      - key: EVENT_REGISTRY_API_KEY
        value: <YOUR_EVENT_REGISTRY_API_KEY>
      - key: NEWSAPI_API_KEY
        value: <YOUR_NEWSAPI_API_KEY>
      - key: CURRENTS_API_KEY
        value: <YOUR_CURRENTS_API_KEY>
      - key: ALPHAVANTAGE_API_KEY
        value: <YOUR_ALPHAVANTAGE_API_KEY>
      - key: NEWSDATA_API_KEY
        value: <YOUR_NEWSDATA_API_KEY>
      - key: YOUTUBE_API_KEY
        value: <YOUR_YOUTUBE_API_KEY>
      - key: MISTRAL_API_KEY
        value: <YOUR_MISTRAL_API_KEY>

services:
  - type: web
    name: ivanintech-backend
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: backend-env
    buildCommand: "pip install uv && cd backend && uv pip install -p python3.11 --system"
    startCommand: "cd backend && playwright install --with-deps && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    autoDeploy: true

  - type: cron
    name: news-fetcher
    runtime: python
    region: frankfurt
    plan: free
    schedule: "0 0 * * *"
    envVars:
      - fromGroup: backend-env
    startCommand: "cd backend && python app/scripts/fetch_news.py"

  - type: web
    name: frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: ivanintech-backend
          property: url
      # --- Firebase Configuration ---
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: <YOUR_FIREBASE_API_KEY>
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: <YOUR_FIREBASE_AUTH_DOMAIN>
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: <YOUR_FIREBASE_PROJECT_ID>
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: <YOUR_FIREBASE_STORAGE_BUCKET>
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: <YOUR_FIREBASE_MESSAGING_SENDER_ID>
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: <YOUR_FIREBASE_APP_ID>