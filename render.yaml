# render.yaml
# Defines all services, databases, and environment variables for the project.
# See https://render.com/docs/blueprint-spec for details.

# NO NECESITAMOS BASE DE DATOS DE RENDER - USAMOS SUPABASE

services:
  # 1. Backend Service (FastAPI)
  # This service runs the Python backend application.
  - type: web
    name: ivanintech-backend
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      # Supabase Configuration
      - key: SUPABASE_URL
        value: https://ajbmphoevktnqbnswytt.supabase.co
      - key: SUPABASE_SERVICE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqYm1waG9ldmt0bnFibnN3eXR0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MDcwMjAxMywiZXhwIjoyMDY2Mjc4MDEzfQ.Tx2ONvWJfDwDdDPDh4JWAtbVGWOGtrE6tRUhaXAbUO4
      # Database URL (opcional, para compatibilidad)
      - key: DATABASE_URL
        value: postgresql://postgres.ajbmphoevktnqbnswytt:Peloponeso33@ajbmphoevktnqbnswytt.supabase.co:5432/postgres
      - key: PROJECT_NAME
        value: ivanintech
      - key: STACK_NAME
        value: ivanintech
      - key: MODULE_NAME
        value: app.main
      - key: VARIABLE_NAME
        value: app
      - key: FIRST_SUPERUSER
        generateValue: true
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SENTRY_DSN
        value: https://c1e7935a51982b545f1c4e7a27a81414@o4507005085483008.ingest.us.sentry.io/4507005088235520
      # API Keys
      - key: GOOGLE_API_KEY
        value: AIzaSyBPRfmwk_1jfmJUzjQJU8MvGSqw
      - key: GEMINI_API_KEY
        value: AIzaSyBPRfmwk_1jfmJUzjQJU8MvGSqw
      - key: GNEWS_API_KEY
        value: d4c2ca4dc4218959b4d2118f6cb2
      - key: EVENT_REGISTRY_API_KEY
        value: 7b1a1fc5-a374-4ae9e1-9fe4b
      - key: NEWSAPI_API_KEY
        value: 8c8ce6f4d67f74fd4c140182b
    buildCommand: "pip install uv && cd backend && uv pip install -p python3.11 --system"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    autoDeploy: true

  # 2. Frontend Service (Next.js)
  # This service runs the Next.js frontend and handles user traffic.
  - type: web
    name: frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      # This variable gets the public URL of the backend service for API calls.
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: ivanintech-backend
          property: url
      # --- Firebase Configuration ---
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyAoeu9NJJEZnibHpHfFjRElDpwRS0eU8AQ
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: web-ivanintech.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: web-ivanintech
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: web-ivanintech.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "954012164014"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
