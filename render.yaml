services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: ivanintech-backend
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - fromGroup: backend-env # Hereda del grupo
    buildCommand: "pip install uv && cd backend && uv pip install -p python3.11 --system"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    autoDeploy: true

  # 2. Cron Job for News Fetching
  - type: cron
    name: news-fetcher
    runtime: python
    region: frankfurt
    plan: free
    schedule: "0 0 * * *" # Todos los días a medianoche UTC
    envVars:
      - fromGroup: backend-env # Hereda del mismo grupo
    startCommand: "cd backend && python app/scripts/fetch_news.py"

  # 3. Frontend Service (Next.js)
  - type: web
    name: frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: ivanintech-backend
          property: url
      # --- Firebase Configuration ---
